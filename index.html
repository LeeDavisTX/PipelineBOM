/* SMYS (ksi) — RIGHT(grade,2) in the workbook */
const SMYS = { "X-52": 52, "X-56": 56, "X-60": 60, "X-65": 65, "X-70": 70, "X-80": 80 };

const fmt3 = (v) => (isFinite(v) ? Number(v).toFixed(3) : "—");
const roundUp3 = (v) => Math.ceil(v * 1000) / 1000;

/* quantity formatting — display with thousands separators, store/parse raw digits */
const onlyDigits = (v) => String(v).replace(/[^0-9]/g, "");
const withCommas = (v) => {
  const d = onlyDigits(v);
  return d ? Number(d).toLocaleString("en-US") : "";
};

/* Barlow: ROUNDUP((MAOP*OD)/(2*SMYS*1000*DF),3) */
const barlowWT = (maop, od, grade, df) => {
  const s = SMYS[grade];
  if (!s || !maop || !od || !df) return null;
  return roundUp3((maop * od) / (2 * s * 1000 * df));
};

const bucketOf = (row) => row.bucket || GROUP_DISPLAY[LABEL_TO_GROUP[row.type]] || "OTHER";


/* ---- file download helper: robust across browsers; returns false if blocked (e.g. sandboxed frame) ---- */
function downloadBlob(blob, filename) {
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    return true;
  } catch (e) {
    return false;
  }
}

/* ---- money helpers ---- */
const money = (n) => (isFinite(n) ? n.toLocaleString("en-US", { style: "currency", currency: "USD" }) : "");
const numOrNull = (v) => {
  const d = String(v == null ? "" : v).replace(/[^0-9.]/g, "");
  if (d === "" || d === ".") return null;
  const n = parseFloat(d);
  return isFinite(n) ? n : null;
};
/* material type = leading segment of the description (matches CSV Material Type column) */
const matType = (text) => (String(text || "").split(",")[0] || "").trim();

/* ---- structured columns for CSV export (computed at add-time) ---- */
const cstr = (t, ty) => (t && t !== "NONE" && ty && ty !== "NONE" ? `${t} ${ty}` : "");
const pipeCoat = (v) => {
  const parts = [];
  const a = cstr(v.c1t, v.c1ty); if (a) parts.push(a);
  const b = cstr(v.c2t, v.c2ty); if (b) parts.push(b);
  if (v.int && v.int !== "NONE") parts.push(`${v.int} INT`);
  return parts.join(" + ");
};

function buildCols(key, v, desc) {
  const c = { size: "", material: "", wt: "", cls: "", standard: "", ends: "", coating: "" };
  switch (key) {
    case "PIPE": {
      const wt = v.wtOverride !== "" ? +v.wtOverride : (desc && desc.calcWT);
      c.size = `${v.size}${IN} OD`;
      c.material = v.grade;
      c.wt = isFinite(wt) ? `${fmt3(wt)}${IN}` : "";
      c.standard = `${v.std1} ${v.std2}`;
      c.coating = pipeCoat(v);
      break;
    }
    case "BEND":
      c.size = `${v.size}${IN} OD`; c.material = v.mat; c.wt = `${fmt3(+v.wt)}${IN}`;
      c.standard = v.std; c.ends = v.ends; c.coating = cstr(v.ct, v.cty);
      break;
    case "TEE":
      c.size = `${v.run}${IN} x ${v.branch}${IN}`; c.material = v.mat; c.wt = `${fmt3(+v.wt)}${IN}`;
      c.standard = v.std; c.ends = v.ends; c.coating = cstr(v.ct, v.cty);
      break;
    case "REDUCER":
      c.size = `${v.large}${IN} x ${v.small}${IN}`; c.material = v.mat; c.wt = `${fmt3(+v.wt)}${IN}`;
      c.standard = v.std; c.ends = v.ends; c.coating = cstr(v.ct, v.cty);
      break;
    case "FLANGE":
      c.size = `${v.size}${IN}`; c.material = v.mat; c.cls = v.cls;
      c.standard = v.std; c.ends = v.face; c.coating = cstr(v.ct, v.cty);
      break;
    case "VALVE":
      c.size = `${v.size}${IN}`; c.cls = v.cls; c.ends = `${v.e1}x${v.e2}`;
      break;
    case "ASSEMBLY":
      c.cls = v.cls;
      break;
    case "AC_RIBBON":
      c.size = v.size; c.material = (v.material || "ZINC RIBBON").toUpperCase();
      break;
    case "ANODE_BED":
      c.material = v.anode;
      break;
    case "GROUND_ROD":
      c.material = v.mat; c.size = `${v.dia} x ${v.len}`;
      break;
    default:
      break; // BUOYANCY, CPTS, AC_DECOUPLER — no common attributes; type + description carry them
  }
  return c;
}

/* ---- material code: short readable join key for pipe/bend/tee/flange/valve (<=20 chars) ---- */
const NPS_MAP = { 2.375: "2", 3.5: "3", 4.5: "4", 6.625: "6", 8.625: "8", 10.75: "10", 12.75: "12", 16: "16", 20: "20", 24: "24", 30: "30", 36: "36", 42: "42", 48: "48", 60: "60" };
const nps = (od) => NPS_MAP[+od] || String(od);
const wmils = (wt) => { const n = Math.round((+wt) * 1000); return isFinite(n) && n > 0 ? String(n) : ""; };
const gradeTok = (g) => String(g || "").replace(/[-\s]/g, ""); // X-70 -> X70
const matTok = (m) => (String(m || "").trim().split(/\s+/).pop() || ""); // "A860 WPHY70" -> WPHY70, "A105" -> A105
const COAT_TOK = { "LIQUID EPOXY": "LEP" }; // others map to themselves (FBE, ARO, 3LPE, 3LPP, CTBE, MRO)
const coatTok = (ty) => (!ty || ty === "NONE" ? "" : (COAT_TOK[ty] || ty));
const extCoat = (v) => coatTok(v.c2t !== "NONE" ? v.c2ty : v.c1ty); // outermost external coat (ARO over FBE -> ARO)
const VALVE_ABBR = { BALL: "BALL", GATE: "GATE", PLUG: "PLUG", GLOBE: "GLB", CHECK: "CHK", BUTTERFLY: "BFLY", NEEDLE: "NDL", "SCREWED & SOCKET WELDED": "SSW", "BELLOWS SEALED": "BLS" };
const valveTok = (t) => VALVE_ABBR[t] || String(t || "").replace(/[^A-Z0-9]/gi, "").slice(0, 4).toUpperCase();
const seg = (...parts) => parts.filter((p) => p !== "" && p != null).join("-").toUpperCase();
function codeOf(key, v, desc) {
  switch (key) {
    case "PIPE": {
      const wt = v.wtOverride !== "" ? +v.wtOverride : (desc && desc.calcWT);
      return seg("PL", nps(v.size), wmils(wt), gradeTok(v.grade), extCoat(v));
    }
    case "BEND": return seg("BN", nps(v.size), wmils(v.wt), matTok(v.mat));
    case "TEE": return seg("TE", `${nps(v.run)}x${v.branch}`, wmils(v.wt), matTok(v.mat));
    case "REDUCER": return seg("RD", `${nps(v.large)}x${nps(v.small)}`, wmils(v.wt), matTok(v.mat));
    case "FLANGE": return seg("FL", nps(v.size), v.cls, matTok(v.mat));
    case "VALVE": return seg("VL", nps(v.size), v.cls, valveTok(v.vtype));
    default: return "";
  }
}

/* =========================================================
   App
   ========================================================= */
function App() {
  const [matKey, setMatKey] = useState("PIPE");
  const [values, setValues] = useState({ ...CATALOG.PIPE.defaults });
  const [qty, setQty] = useState("1");
  const [rows, setRows] = useState([]);
  const [view, setView] = useState("input"); // mobile tab
  const [flash, setFlash] = useState(null);

  const cat = CATALOG[matKey];

  const pickMaterial = (k) => {
    setMatKey(k);
    setValues({ ...CATALOG[k].defaults });
  };

  const setVal = (k, v) => {
    setValues((prev) => {
      const next = { ...prev, [k]: v };
      // keep dependent material list valid when standard changes
      const dep = cat.fields.find((f) => f.optsBy && f.optsBy.dep === k);
      if (dep) {
        const opts = dep.optsBy.map[v] || [];
        if (!opts.includes(next[dep.k])) next[dep.k] = opts[0] || "";
      }
      return next;
    });
  };

  // dropdown change: handle the OTHER sentinel, otherwise behave like setVal
  const selectOpt = (f, val) => {
    if (f.allowOther && val === "OTHER") {
      setValues((prev) => ({ ...prev, [f.k + "__o"]: true, [f.k]: "" }));
      return;
    }
    setValues((prev) => {
      const next = { ...prev, [f.k]: val, [f.k + "__o"]: false };
      const dep = cat.fields.find((x) => x.optsBy && x.optsBy.dep === f.k);
      if (dep) {
        const opts = dep.optsBy.map[val] || [];
        if (!opts.includes(next[dep.k])) next[dep.k] = opts[0] || "";
      }
      return next;
    });
  };

  const desc = useMemo(() => {
    try { return cat.describe(values); } catch { return { text: "" }; }
  }, [cat, values]);

  const liveCode = useMemo(() => {
    try { return codeOf(matKey, values, desc); } catch { return ""; }
  }, [matKey, values, desc]);

  const notice = cat.notice ? cat.notice(values) : null;

  const addToSchedule = () => {
    const nextNo = rows.length ? Math.max(...rows.map((r) => r.no)) + 1 : 1;
    setRows((r) => [...r, { id: Date.now() + Math.random(), no: nextNo, idTag: "", qty: Math.max(1, parseInt(onlyDigits(qty)) || 1), source: "", unitCost: "", type: cat.label.toUpperCase(), text: desc.text, code: codeOf(matKey, values, desc), cols: buildCols(matKey, values, desc), ...(matKey === "CUSTOM" ? { bucket: values.category } : {}) }]);
    setFlash(desc.text);
    setTimeout(() => setFlash(null), 1800);
  };

  const sorted = useMemo(() => [...rows].sort((a, b) => a.no - b.no), [rows]);

  // extended cost per row, grouped rollup by material type, and grand total
  const extOf = (r) => {
    const u = numOrNull(r.unitCost);
    return u == null ? null : u * (r.qty || 0);
  };
  const costGroups = useMemo(() => {
    const m = new Map();
    sorted.forEach((r) => {
      const key = bucketOf(r);
      const ext = extOf(r);
      const g = m.get(key) || { type: key, count: 0, total: 0, priced: 0 };
      g.count += 1;
      if (ext != null) { g.total += ext; g.priced += 1; }
      m.set(key, g);
    });
    return GROUP_ORDER.filter((k) => m.has(k)).map((k) => m.get(k));
  }, [sorted]);
  const costTotal = useMemo(() => costGroups.reduce((s, g) => s + g.total, 0), [costGroups]);
  const anyPriced = useMemo(() => sorted.some((r) => numOrNull(r.unitCost) != null), [sorted]);

  const updateRow = (id, patch) => setRows((r) => r.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  const removeRow = (id) => setRows((r) => r.filter((x) => x.id !== id));
  const renumber = () => setRows(sorted.map((r, i) => ({ ...r, no: i + 1 })));

  const exportCSV = () => {
    const esc = (s) => `"${String(s == null ? "" : s).replace(/"/g, '""')}"`;
    const header = ["ITEM", "QTY", "MATERIAL TYPE", "CATEGORY", "MATERIAL CODE", "SIZE", "MATERIAL / GRADE", "WALL THICKNESS", "CLASS", "STANDARD / SPEC", "ENDS", "COATING", "DESCRIPTION", "SOURCE", "UNIT COST", "TOTAL"];
    const lines = [header.join(","),
      ...sorted.map((r) => {
        const c = r.cols || {};
        const mtype = (r.text.split(",")[0] || "").trim(); // first segment of the description
        const u = numOrNull(r.unitCost);
        const ext = u == null ? "" : (u * (r.qty || 0)).toFixed(2);
        return [r.no, r.qty, esc(mtype), esc(bucketOf(r)), esc(r.code), esc(c.size), esc(c.material), esc(c.wt), esc(c.cls), esc(c.standard), esc(c.ends), esc(c.coating), esc(r.text), esc(r.source), u == null ? "" : u.toFixed(2), ext].join(",");
      })];
    // UTF-8 BOM so Excel renders ° (bend angle) and other non-ASCII correctly
    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    const ok = downloadBlob(blob, "material-list.csv");
    if (!ok) flashLoadMsg({ tone: "err", msg: "Download was blocked by the preview frame. It works on the deployed site (GitHub Pages / Netlify) or when the page is opened directly." });
  };

  /* ---- save / load schedule as JSON ---- */
  const fileRef = useRef(null);
  const [loadMsg, setLoadMsg] = useState(null);
  const flashLoadMsg = (m) => { setLoadMsg(m); setTimeout(() => setLoadMsg(null), 6000); };

  const saveJSON = () => {
    const payload = {
      tool: "PIPELINE BILL OF MATERIALS",
      rev: "5E-web",
      savedAt: new Date().toISOString(),
      rows: sorted.map(({ no, idTag, qty, source, unitCost, type, text, code, cols, bucket }) => ({ no, idTag, qty, source, unitCost, type, text, code, cols, bucket })),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const ok = downloadBlob(blob, "material-list.json");
    if (!ok) flashLoadMsg({ tone: "err", msg: "Download was blocked by the preview frame. It works on the deployed site (GitHub Pages / Netlify) or when the page is opened directly." });
  };

  const loadJSON = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow re-loading the same file later
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const list = Array.isArray(data) ? data : data.rows;
        if (!Array.isArray(list)) throw new Error("no rows");
        const cleaned = list
          .filter((r) => r && typeof r.text === "string")
          .map((r, i) => ({
            id: Date.now() + i + Math.random(),
            no: Number.isFinite(+r.no) && +r.no > 0 ? +r.no : i + 1,
            idTag: typeof r.idTag === "string" ? r.idTag : "",
            qty: Number.isFinite(+r.qty) && +r.qty > 0 ? +r.qty : 1,
            source: typeof r.source === "string" ? r.source : "",
            unitCost: r.unitCost == null ? "" : String(r.unitCost),
            type: typeof r.type === "string" ? r.type : "",
            text: r.text,
            code: typeof r.code === "string" ? r.code : "",
            cols: r.cols && typeof r.cols === "object" ? r.cols : {},
            bucket: typeof r.bucket === "string" ? r.bucket : undefined,
          }));
        if (!cleaned.length) throw new Error("empty");
        setRows(cleaned);
        setLoadMsg({ tone: "ok", msg: `Loaded ${cleaned.length} item${cleaned.length === 1 ? "" : "s"} from ${file.name} — replaced the current list` });
      } catch {
        setLoadMsg({ tone: "err", msg: `Couldn't read ${file.name} — choose a list saved from this tool (.json)` });
      }
      setTimeout(() => setLoadMsg(null), 5000);
    };
    reader.readAsText(file);
  };

  useEffect(() => {
    document.title = "Pipeline Bill of Materials";
  }, []);

  return (
    <div className="app">
      <style>{CSS}</style>

      <header className="hdr">
        <div className="hdr-mark">PBOM</div>
        <div>
          <h1>Pipeline Bill of Materials</h1>
          <div className="hdr-sub">rev 6</div>
        </div>
        <div className="hdr-count">{rows.length} item{rows.length === 1 ? "" : "s"}{costTotal > 0 ? ` · ${money(costTotal)}` : ""}</div>
      </header>

      <nav className="tabs">
        <button className={view !== "cost" ? "on" : ""} onClick={() => setView("input")}>Material Input {rows.length > 0 && <span className="pill">{rows.length}</span>}</button>
        <button className={view === "cost" ? "on" : ""} onClick={() => setView("cost")}>Material Cost</button>
      </nav>

      <main className={`cols view-${view}`}>
        {/* ---------------- INPUT ---------------- */}
        <section className="panel input-panel">
          <h2 className="panel-title">Select material type</h2>
          <div className="type-grid">
            {GROUPS.map((g) => (
              <div key={g} className="type-group">
                <div className="type-group-label">{g}</div>
                <div className="chips">
                  {Object.entries(CATALOG).filter(([, c]) => c.group === g).map(([k, c]) => (
                    <button key={k} className={`chip ${matKey === k ? "chip-on" : ""}`} onClick={() => pickMaterial(k)}>{c.label}</button>
                  ))}
                </div>
              </div>
            ))}
          </div>

          <h2 className="panel-title">Specifications — {cat.label}</h2>
          <div className="fields">
            {cat.fields.filter((f) => !f.showIf || f.showIf(values)).map((f) => {
              const opts = f.optsBy ? (f.optsBy.map[values[f.optsBy.dep]] || []) : f.opts;
              const isOther = !!values[f.k + "__o"];
              return (
                <label key={f.k} className={"field" + (f.type === "textarea" ? " field-full" : "")}>
                  <span className="field-label">{f.label}</span>
                  {f.type === "select" ? (
                    <>
                      <select value={isOther ? "OTHER" : values[f.k]} onChange={(e) => selectOpt(f, e.target.value)}>
                        {opts.map((o) => <option key={o} value={o}>{o}</option>)}
                        {f.allowOther && <option value="OTHER">OTHER…</option>}
                      </select>
                      {isOther && (
                        <input className="other-input" type="text" autoFocus placeholder="Enter value"
                          value={values[f.k]} onChange={(e) => setVal(f.k, e.target.value.toUpperCase())} />
                      )}
                    </>
                  ) : f.type === "textarea" ? (
                    <textarea className="ta-input" rows={2} value={values[f.k]} placeholder="Type the full material description…"
                      onChange={(e) => setVal(f.k, e.target.value)} />
                  ) : (
                    <input type={f.type} step={f.step} min={f.min} max={f.max} value={values[f.k]} placeholder={f.hint ? "auto" : ""} onChange={(e) => setVal(f.k, e.target.value)} />
                  )}
                  {f.hint && <span className="field-hint">{f.hint}</span>}
                </label>
              );
            })}
          </div>

          {matKey === "PIPE" && desc.calcWT != null && (
            <div className="calc-line">
              Barlow WT = ({values.maop} × {values.size}) / (2 × {SMYS[values.grade]},000 × {values.df}) → <strong>{fmt3(desc.calcWT)}{IN}</strong>
              {values.wtOverride !== "" && <span className="calc-override"> · using override {fmt3(+values.wtOverride)}{IN}</span>}
            </div>
          )}

          {matKey === "PIPE" && (
            <label className="toggle">
              <input type="checkbox" checked={values.useShort} onChange={(e) => setVal("useShort", e.target.checked)} />
              <span>Use short description</span>
            </label>
          )}

          {notice && <div className={`notice notice-${notice.tone}`}>{notice.msg}</div>}

          <div className="preview">
            <div className="preview-label">Material description</div>
            <div className="preview-text">{desc.text}</div>
            {liveCode && (
              <div className="preview-code">
                <span className="preview-code-label">Material code</span>
                <span className="preview-code-val">{liveCode}</span>
              </div>
            )}
          </div>

          <div className="submit-row">
            <label className="qty-field">
              <span className="field-label">Qty</span>
              <input type="text" inputMode="numeric" value={withCommas(qty)} onChange={(e) => setQty(onlyDigits(e.target.value))} />
            </label>
            <button className="btn-primary" onClick={addToSchedule} disabled={!desc.text.trim()}>Add to list →</button>
          </div>
          {flash && <div className="flash">Added: {flash.slice(0, 60)}{flash.length > 60 ? "…" : ""}</div>}
        </section>

        {/* ---------------- SCHEDULE ---------------- */}
        <section className="panel sched-panel">
          <div className="sched-head">
            <h2 className="panel-title">Material list</h2>
            <div className="sched-actions">
              <button className="btn-ghost" onClick={saveJSON} disabled={!rows.length}>Save list</button>
              <button className="btn-ghost" onClick={() => fileRef.current && fileRef.current.click()}>Load list</button>
              <input ref={fileRef} type="file" accept=".json,application/json" style={{ display: "none" }} onChange={loadJSON} />
              <button className="btn-ghost" onClick={renumber} disabled={!rows.length}>Renumber 1–{rows.length || "n"}</button>
              <button className="btn-ghost" onClick={exportCSV} disabled={!rows.length}>Export CSV</button>
            </div>
          </div>

          {loadMsg && <div className={`notice ${loadMsg.tone === "ok" ? "notice-ok" : "notice-err"}`}>{loadMsg.msg}</div>}

          {rows.length === 0 ? (
            <div className="empty">
              No materials yet. Build a description on the input page and select <strong>Add to list</strong> — items are numbered automatically and the numbers stay editable here.
            </div>
          ) : (
            <table className="sched">
              <thead>
                <tr><th className="col-no">Item</th><th className="col-code">Code</th><th className="col-qty">Qty</th><th>Description</th><th className="col-x"></th></tr>
              </thead>
              <tbody>
                {sorted.map((r) => (
                  <tr key={r.id}>
                    <td className="col-no">
                      <input className="no-input" type="number" min="1" value={r.no}
                        onChange={(e) => updateRow(r.id, { no: parseInt(e.target.value) || 0 })} />
                    </td>
                    <td className="col-code">{r.code ? <span className="code-cell">{r.code}</span> : <span className="code-none">—</span>}</td>
                    <td className="col-qty">
                      <input className="no-input qty-input" type="text" inputMode="numeric" value={withCommas(r.qty)}
                        onChange={(e) => updateRow(r.id, { qty: Math.max(1, parseInt(onlyDigits(e.target.value)) || 1) })} />
                    </td>
                    <td>
                      <div className="row-type">{r.type}</div>
                      <div className="row-text">{r.text}</div>
                    </td>
                    <td className="col-x"><button className="del" title="Remove" onClick={() => removeRow(r.id)}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </section>

        {/* ---------------- COSTING ---------------- */}
        <section className="panel cost-panel">
          <div className="sched-head">
            <h2 className="panel-title">Bill of materials</h2>
            <div className="sched-actions">
              <button className="btn-ghost" onClick={exportCSV} disabled={!rows.length}>Export CSV</button>
            </div>
          </div>

          {loadMsg && <div className={`notice ${loadMsg.tone === "ok" ? "notice-ok" : "notice-err"}`}>{loadMsg.msg}</div>}

          {rows.length === 0 ? (
            <div className="empty">
              No materials yet. Add items on the input page, then enter a source and unit cost for each here to build the cost rollup.
            </div>
          ) : (
            <>
              <table className="sched cost-table">
                <thead>
                  <tr>
                    <th className="col-no">Item</th>
                    <th className="col-mtype">Type</th>
                    <th className="col-code">Code</th>
                    <th>Description</th>
                    <th className="col-qty2">Qty</th>
                    <th className="col-src">Source</th>
                    <th className="col-unit">Unit cost</th>
                    <th className="col-ext">Total</th>
                  </tr>
                </thead>
                <tbody>
                  {sorted.map((r) => {
                    const ext = extOf(r);
                    return (
                      <tr key={r.id}>
                        <td className="col-no mono">{r.no}</td>
                        <td className="col-mtype"><span className="mtype-chip">{matType(r.text)}</span></td>
                        <td className="col-code">{r.code ? <span className="code-cell">{r.code}</span> : <span className="code-none">—</span>}</td>
                        <td><div className="row-text">{r.text}</div>{r.idTag ? <div className="row-tag">Tag: {r.idTag}</div> : null}</td>
                        <td className="col-qty2">
                          <input className="no-input qty-input" type="text" inputMode="numeric" value={withCommas(r.qty)}
                            onChange={(e) => updateRow(r.id, { qty: Math.max(1, parseInt(onlyDigits(e.target.value)) || 1) })} />
                        </td>
                        <td className="col-src">
                          <input className="src-input" type="text" placeholder="vendor / mfr / mill"
                            value={r.source || ""} onChange={(e) => updateRow(r.id, { source: e.target.value })} />
                        </td>
                        <td className="col-unit">
                          <div className="cost-field">
                            <span className="cost-pre">$</span>
                            <input className="unit-input" type="text" inputMode="decimal" placeholder="0.00"
                              value={r.unitCost || ""} onChange={(e) => updateRow(r.id, { unitCost: e.target.value.replace(/[^0-9.]/g, "") })} />
                          </div>
                        </td>
                        <td className="col-ext mono ext">{ext == null ? "—" : money(ext)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              <h2 className="panel-title cost-summary-title">Cost by category</h2>
              <table className="sched summary-table">
                <thead>
                  <tr><th>Category</th><th className="col-cnt">Items</th><th className="col-sum">Subtotal</th></tr>
                </thead>
                <tbody>
                  {costGroups.map((g) => (
                    <tr key={g.type}>
                      <td><span className="mtype-chip">{g.type}</span></td>
                      <td className="col-cnt mono">{g.priced < g.count ? `${g.priced}/${g.count}` : g.count}</td>
                      <td className="col-sum mono">{g.total > 0 || g.priced > 0 ? money(g.total) : "—"}</td>
                    </tr>
                  ))}
                </tbody>
                <tfoot>
                  <tr className="grand">
                    <td>Grand total</td>
                    <td className="col-cnt mono">{rows.length}</td>
                    <td className="col-sum mono">{money(costTotal)}</td>
                  </tr>
                </tfoot>
              </table>
              {!anyPriced && <div className="cost-hint">Enter a unit cost on any line to start the rollup. Blank costs count as $0 and show as “—”.</div>}
            </>
          )}
        </section>
      </main>
    </div>
  );
}

/* ---------------- styles ---------------- */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap');

:root{
  --ink:#12161C; --ink-2:#4A6B8A; --line:#E6E2E2; --paper:#FAF9F9; --card:#ffffff;
  --safety:#B84A1A; --safety-dark:#9A3D15; --steel:#142442; --support:#4A6B8A; --ok:#1c7c4d; --warn:#B84A1A;
}
*{box-sizing:border-box}
.app{min-height:100vh;background:var(--paper);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;font-size:15px}

.hdr{display:flex;align-items:center;gap:14px;background:var(--steel);color:#fff;padding:14px 20px}
.hdr-mark{font-family:'Montserrat';font-weight:700;font-size:20px;letter-spacing:.08em;background:var(--safety);color:#fff;padding:6px 10px;border-radius:3px}
.hdr h1{margin:0;font-family:'Montserrat';font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.hdr-sub{font-size:12px;color:#9fb2bd;letter-spacing:.04em}
.hdr-count{margin-left:auto;font-family:'Open Sans';font-size:12px;color:#AEBED0;white-space:nowrap;font-variant-numeric:tabular-nums}

.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px;border:none;background:none;font:inherit;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--safety-dark);border-bottom-color:var(--safety)}
.pill{background:var(--safety);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:6px}

.cols{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:18px;padding:18px;max-width:1400px;margin:0 auto}
.cost-panel{display:none}
.cols.view-cost{grid-template-columns:1fr}
.cols.view-cost .input-panel,.cols.view-cost .sched-panel{display:none}
.cols.view-cost .cost-panel{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.panel-title{font-family:'Montserrat';font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px}
.panel-title + .panel-title, .fields + .panel-title{margin-top:20px}

.type-group{margin-bottom:10px}
.type-group-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:500;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--safety)}
.chip-on{background:var(--safety);border-color:var(--safety);color:#fff;font-weight:600}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:3px}
.field-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.field select,.field input,.qty-field input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
.field select:focus,.field input:focus,.qty-field input:focus,.no-input:focus{outline:2px solid var(--safety);outline-offset:1px}
.field-hint{font-size:11px;color:var(--ink-2)}
.field-full{grid-column:1 / -1}
.ta-input{font:inherit;padding:8px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);resize:vertical;min-height:44px;font-family:'Open Sans';font-size:13px}
.ta-input:focus{outline:2px solid var(--safety);outline-offset:1px}
.other-input{margin-top:5px;font:inherit;padding:7px 9px;border:1px solid var(--safety);border-radius:5px;background:#fff;color:var(--ink)}
.other-input:focus{outline:2px solid var(--safety);outline-offset:1px}

.calc-line{margin-top:12px;font-family:'Open Sans';font-size:12px;color:var(--ink-2);background:#F1EFEF;border-left:3px solid var(--steel);padding:8px 10px;border-radius:0 4px 4px 0;font-variant-numeric:tabular-nums}
.calc-override{color:var(--safety-dark);font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;cursor:pointer}
.notice{margin-top:12px;padding:8px 12px;border-radius:5px;font-size:13px;font-weight:500}
.notice-warn{background:#F6E7DE;color:var(--warn);border:1px solid #E4C2AE}
.notice-ok{background:#e9f5ee;color:var(--ok);border:1px solid #bfe0cd}
.notice-err{background:#fbeaea;color:#a02020;border:1px solid #ecc6c6}

.preview{margin-top:16px;background:#E6E2E2;border:1px solid #d3cecd;border-radius:6px;padding:12px 14px;position:relative}
.preview-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--safety-dark);font-weight:700;margin-bottom:6px}
.preview-text{font-family:'Open Sans';font-size:13.5px;font-weight:600;line-height:1.55;color:#000;word-break:break-word}
.preview-code{margin-top:10px;padding-top:9px;border-top:1px solid rgba(0,0,0,.16);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.preview-code-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--safety-dark);font-weight:700}
.preview-code-val{font-family:'Open Sans';font-size:14px;font-weight:700;letter-spacing:.02em;color:#000;background:#fff;border:1px solid #c7c1c0;border-radius:4px;padding:3px 8px}

.submit-row{display:flex;gap:10px;margin-top:14px;align-items:flex-end}
.qty-field{display:flex;flex-direction:column;gap:3px;width:128px}
.btn-primary{flex:1;font:inherit;font-weight:700;font-size:15px;letter-spacing:.03em;background:var(--safety);color:#fff;border:none;border-radius:6px;padding:11px;cursor:pointer}
.btn-primary:hover{background:var(--safety-dark)}
.btn-primary:disabled{opacity:.45;cursor:default}
.flash{margin-top:8px;font-size:12px;color:var(--ok);font-family:'Open Sans'}

.sched-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sched-head .panel-title{border:none;margin:0;padding:0}
.sched-actions{display:flex;gap:8px}
.btn-ghost{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);cursor:pointer}
.btn-ghost:hover:not(:disabled){border-color:var(--safety);color:var(--safety-dark)}
.btn-ghost:disabled{opacity:.45;cursor:default}

.empty{margin-top:14px;padding:28px 18px;border:1.5px dashed var(--line);border-radius:6px;color:var(--ink-2);font-size:14px;text-align:center}

.sched{width:100%;border-collapse:collapse;margin-top:12px}
.sched th{font-family:'Montserrat';font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:6px 8px;border-bottom:2px solid var(--steel)}
.sched td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.col-no{width:64px}.col-code{width:168px}.col-qty{width:108px}.col-x{width:36px}
.no-input{width:56px;font-family:'Open Sans';font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:4px;text-align:center;font-variant-numeric:tabular-nums}
.code-cell{display:inline-block;font-family:'Open Sans';font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--steel);background:#EFECEC;border:1px solid var(--line);border-radius:3px;padding:2px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.code-none{color:var(--ink-2)}
.qty-input{width:96px;text-align:right}
.row-type{font-size:10px;letter-spacing:.12em;color:var(--safety-dark);font-weight:700;margin-bottom:2px}
.row-text{font-family:'Open Sans';font-size:13px;line-height:1.5;word-break:break-word}
.del{border:none;background:none;color:var(--ink-2);font-size:14px;cursor:pointer;padding:4px;border-radius:4px}
.del:hover{color:#a02020;background:#F7E7E7}

/* costing tab */
.mono{font-family:'Open Sans';font-size:13px;font-variant-numeric:tabular-nums}
.unit-input,.summary-table .col-sum,.summary-table .col-cnt,.cost-table .col-qty2,.preview-code-val{font-variant-numeric:tabular-nums}
.cost-table .col-mtype{width:96px}
.cost-table .col-qty2{width:104px;text-align:right}
.cost-table .col-src{width:170px}
.cost-table .col-unit{width:120px}
.cost-table .col-ext{width:110px;text-align:right}
.mtype-chip{display:inline-block;font-size:10px;letter-spacing:.08em;font-weight:700;color:var(--safety-dark);background:#F3E1D8;border-radius:3px;padding:2px 6px;white-space:nowrap}
.row-tag{font-size:11px;color:var(--ink-2);margin-top:2px}
.src-input{width:100%;font:inherit;font-size:13px;padding:6px 7px;border:1px solid var(--line);border-radius:4px}
.src-input:focus,.unit-input:focus{outline:2px solid var(--safety);outline-offset:1px}
.cost-field{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:#fff}
.cost-field:focus-within{outline:2px solid var(--safety);outline-offset:1px}
.cost-pre{color:var(--ink-2);font-family:'Open Sans';font-size:13px}
.unit-input{width:100%;border:none;outline:none;font-family:'Open Sans';font-size:13px;padding:6px 2px;text-align:right;background:transparent}
.ext{font-weight:600}
.cost-summary-title{margin-top:22px}
.summary-table{max-width:520px}
.summary-table .col-cnt{width:80px;text-align:right}
.summary-table .col-sum{width:140px;text-align:right}
.summary-table td{padding:8px}
.summary-table tfoot .grand td{border-top:2px solid var(--steel);border-bottom:none;font-family:'Montserrat';font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding-top:10px}
.summary-table tfoot .grand .col-sum{color:var(--safety-dark);font-family:'Open Sans';font-size:15px}
.cost-hint{margin-top:12px;font-size:12px;color:var(--ink-2)}

@media (max-width: 980px){
  .tabs{display:flex}
  .cols{display:block;padding:12px}
  .panel{margin-bottom:12px}
  .view-input .cost-panel{display:none}
  .view-cost .input-panel,.view-cost .sched-panel{display:none}
  .view-cost .cost-panel{display:block}
  .cost-panel{overflow-x:auto}
  .fields{grid-template-columns:1fr 1fr}
  .hdr-count{display:none}
}
@media (max-width: 520px){ .fields{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
`;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
